name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27'

      # Plain compile first: a cold `rebar3 as test ltest` fails while
      # compiling ltest's own LFE sources before the lfe dep is built
      # (documented in docs/getting-started.md).
      - name: Compile
        run: rebar3 compile

      - name: Test
        run: rebar3 as test ltest
